<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpendWise</title>
<meta name="description" content="SpendWise：LINE Bot 智慧消費與信用卡優惠整合平台。世新大學資訊管理學系畢業專題。">
<style>
  :root {
    --text: #222;
    --muted: #666;
    --subtle: #999;
    --line: #eee;
    --accent: #06C755;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--text); }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 32rem;
    margin: 0 auto;
    padding: 4rem 1.25rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .badge {
    display: inline-block;
    align-self: flex-start;
    font-size: .8rem;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .2rem .75rem;
    margin-bottom: 1.25rem;
  }
  h1 {
    font-size: 2.25rem;
    letter-spacing: .02em;
    margin: 0 0 .5rem;
  }
  .tagline {
    font-size: 1.1rem;
    color: var(--muted);
    margin: 0 0 2.5rem;
  }
  .tagline strong { color: var(--accent); font-weight: 600; }
  footer {
    width: 100%;
    max-width: 32rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 2rem;
    border-top: 1px solid var(--line);
    font-size: .85rem;
    color: var(--subtle);
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 1.25rem;
    justify-content: space-between;
  }
  a { color: var(--text); }
  a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <span class="badge">世新大學資訊管理學系 畢業專題</span>
  <h1>SpendWise</h1>
  <p class="tagline"><strong>LINE Bot</strong> 智慧消費與信用卡優惠整合平台</p>
</main>
<footer>
  <span>© 2026 SpendWise</span>
  <a href="privacy.html">隱私權政策</a>
</footer>
</body>
</html>
